<div class="clock-container">
  <div class="clock">
    <div class="hand hour" id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
    <div class="center-dot"></div>
    <div class="number n12">12</div>
    <div class="number n3">3</div>
    <div class="number n6">6</div>
    <div class="number n9">9</div>
    <div class="digital-display" id="digitalDisplay">00:00:00 AM</div>
    <div class="date-display" id="dateDisplay">MONDAY, JAN 1</div>
    <div class="glow-ring"></div>
  </div>
</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .clock-container {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .clock {
    width: 380px;
    height: 380px;
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 50%;
    border: 3px solid rgba(56, 189, 248, 0.25);
    box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(56, 189, 248, 0.08), 0 0 40px rgba(56, 189, 248, 0.15);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .glow-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg at 50% 50%, rgba(56, 189, 248, 0), rgba(56, 189, 248, 0.3), rgba(244, 63, 94, 0.3), rgba(56, 189, 248, 0));
    animation: rotateGlow 10s linear infinite;
    z-index: -1;
    opacity: 0.7;
  }

  @keyframes rotateGlow {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 4px;
    z-index: 10;
  }

  .hour {
    width: 6px;
    height: 75px;
    background: #f8fafc;
    margin-left: -3px;
    box-shadow: 0 0 10px rgba(248, 250, 252, 0.5);
  }

  .minute {
    width: 4px;
    height: 100px;
    background: #38bdf8;
    margin-left: -2px;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
  }

  .second {
    width: 2px;
    height: 115px;
    background: #f43f5e;
    margin-left: -1px;
    z-index: 11;
    box-shadow: 0 0 10px rgba(244, 63, 94, 0.8);
  }

  .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    background: #f43f5e;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 12;
    box-shadow: 0 0 12px #f43f5e;
  }

  .number {
    position: absolute;
    color: #64748b;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 1px;
  }

  .n12 { top: 18px; left: 50%; transform: translateX(-50%); }
  .n3  { right: 22px; top: 50%; transform: translateY(-50%); }
  .n6  { bottom: 18px; left: 50%; transform: translateX(-50%); }
  .n9  { left: 22px; top: 50%; transform: translateY(-50%); }

  .digital-display {
    position: absolute;
    bottom: 85px;
    color: #38bdf8;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    z-index: 5;
    background: rgba(15, 23, 42, 0.6);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(56, 189, 248, 0.2);
  }

  .date-display {
    position: absolute;
    top: 95px;
    color: #94a3b8;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 5;
  }

  .date-display {
    position: absolute;
    top: 85px;
    color: #94a3b8;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 5;
  }
</style>

<script>
  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const digitalDisplay = document.getElementById('digitalDisplay');
  const dateDisplay = document.getElementById('dateDisplay');

  function updateClock() {
    const now = new Date();
    
    const seconds = now.getSeconds();
    const minutes = now.getMinutes();
    const hours = now.getHours();

    const secondDeg = seconds * 6;
    const minuteDeg = (minutes * 6) + (seconds * 0.1);
    const hourDeg = (hours % 12 * 30) + (minutes * 0.5);

    secondHand.style.transform = `rotate(${secondDeg}deg)`;
    minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
    hourHand.style.transform = `rotate(${hourDeg}deg)`;

    const hoursStr = String(hours % 12 || 12).padStart(2, '0');
    const minutesStr = String(minutes).padStart(2, '0');
    const secondsStr = String(seconds).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    
    digitalDisplay.textContent = `${hoursStr}:${minutesStr}:${secondsStr} ${ampm}`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateDisplay.textContent = now.toLocaleDateString('en-US', options).toUpperCase();
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>
