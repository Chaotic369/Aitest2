<div class="clock-container">
  <div class="mode-tabs">
    <button class="tab active" data-mode="work">focus</button>
    <button class="tab" data-mode="short">short break</button>
    <button class="tab" data-mode="long">long break</button>
  </div>
  <div class="time-wrapper">
    <div id="time" class="time">25:00</div>
  </div>
  <div class="controls">
    <button id="toggle-btn" class="btn-primary">start</button>
    <button id="reset-btn" class="btn-icon" title="Reset" aria-label="Reset">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
  <div id="session-counter" class="session-counter">session #1</div>
</div>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .clock-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d0e11;
    color: #e4e4e7;
    user-select: none;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    padding: 4px;
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    margin-bottom: 2.5rem;
  }
  .tab {
    background: transparent;
    border: none;
    color: #71717a;
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    border-radius: 9999px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .tab:hover {
    color: #d4d4d8;
  }
  .tab.active {
    background: rgba(255, 255, 255, 0.1);
    color: #fafafa;
  }
  .time-wrapper {
    margin-bottom: 2.5rem;
  }
  .time {
    font-size: 7rem;
    font-weight: 200;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    color: #fafafa;
    line-height: 1;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.04);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .btn-primary {
    background: #fafafa;
    color: #09090b;
    border: none;
    min-width: 110px;
    padding: 12px 32px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    border-radius: 9999px;
    cursor: pointer;
    transition: transform 0.15s ease, background-color 0.2s ease;
  }
  .btn-primary:hover {
    background: #ffffff;
    transform: scale(1.02);
  }
  .btn-primary:active {
    transform: scale(0.97);
  }
  .btn-icon {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #a1a1aa;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-icon:hover {
    color: #fafafa;
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.04);
  }
  .btn-icon:active {
    transform: scale(0.95);
  }
  .session-counter {
    margin-top: 2.5rem;
    font-size: 0.75rem;
    color: #52525b;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
</style>

<script>
  const MODES = {
    work: 25 * 60,
    short: 5 * 60,
    long: 15 * 60
  };

  let currentMode = 'work';
  let timeLeft = MODES[currentMode];
  let isRunning = false;
  let timerId = null;
  let sessionCount = 1;

  const timeDisplay = document.getElementById('time');
  const toggleBtn = document.getElementById('toggle-btn');
  const resetBtn = document.getElementById('reset-btn');
  const sessionCounter = document.getElementById('session-counter');
  const tabs = document.querySelectorAll('.tab');

  function renderTime() {
    const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const seconds = (timeLeft % 60).toString().padStart(2, '0');
    timeDisplay.textContent = `${minutes}:${seconds}`;
    document.title = `${minutes}:${seconds} — Pomodoro`;
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function triggerHaptic(pattern = 15) {
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (e) {}
    }
  }

  function playButtonClick() {
    triggerHaptic(12);
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.04);
    } catch (e) {}
  }

  function playTick() {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const isEven = timeLeft % 2 === 0;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(isEven ? 1300 : 950, ctx.currentTime);
      gain.gain.setValueAtTime(0.025, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.015);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.015);
    } catch (e) {}
  }

  function playTring() {
    triggerHaptic([120, 60, 120, 60, 250]);
    try {
      const ctx = getAudioCtx();
      const start = ctx.currentTime;
      [0, 0.22, 0.44, 0.66].forEach(offset => {
        [853, 960].forEach(freq => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start + offset);
          gain.gain.setValueAtTime(0.09, start + offset);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + offset + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start + offset);
          osc.stop(start + offset + 0.18);
        });
      });
    } catch (e) {}
  }

  function switchMode(mode) {
    pauseTimer();
    currentMode = mode;
    timeLeft = MODES[currentMode];
    tabs.forEach(tab => {
      tab.classList.toggle('active', tab.dataset.mode === mode);
    });
    renderTime();
  }

  function handleComplete() {
    pauseTimer();
    playTring();

    if (currentMode === 'work') {
      sessionCount++;
      sessionCounter.textContent = `session #${sessionCount}`;
      const nextMode = sessionCount % 4 === 0 ? 'long' : 'short';
      switchMode(nextMode);
    } else {
      switchMode('work');
    }
  }

  function tick() {
    if (timeLeft > 0) {
      timeLeft--;
      renderTime();
      playTick();
      if (timeLeft === 0) {
        handleComplete();
      }
    }
  }

  function startTimer() {
    isRunning = true;
    toggleBtn.textContent = 'pause';
    timerId = setInterval(tick, 1000);
  }

  function pauseTimer() {
    isRunning = false;
    toggleBtn.textContent = 'start';
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  toggleBtn.addEventListener('click', () => {
    playButtonClick();
    if (isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  });

  resetBtn.addEventListener('click', () => {
    playButtonClick();
    pauseTimer();
    timeLeft = MODES[currentMode];
    renderTime();
  });

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      playButtonClick();
      if (tab.dataset.mode !== currentMode) {
        switchMode(tab.dataset.mode);
      }
    });
  });

  renderTime();
</script>
